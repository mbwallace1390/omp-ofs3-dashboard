name: OFS3 telemetry and Lua checks

on:
  push:
    branches: [main, master, 'RF-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ofs3-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install desktop Lua runtime
        run: python -m pip install -r tests/requirements.txt
      - name: Check source syntax and telemetry behavior
        run: python -m unittest discover -s tests -p 'test_*.py' -v
